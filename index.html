<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#10251b">
  <title>BIKERS: Philippine Streets</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="game">
    <div id="loading" class="overlay">
      <div class="panel">
        <div class="eyebrow">A PHILIPPINE CYCLING ADVENTURE</div>
        <h1>BIKERS<span>:</span><br>Philippine Streets</h1>
        <p>Ride through the barangay. Collect coins. Watch the road.</p>
        <button id="startButton" class="primary">START RIDING</button>
        <small>WASD / arrow keys • Mobile touch controls</small>
      </div>
    </div>
    <div id="hud" aria-live="polite">
      <div class="brand">BIKERS <span>PHILIPPINE STREETS</span></div>
      <div class="stats">
        <div class="stat"><small>SPEED</small><strong><span id="speed">0</span><small> km/h</small></strong></div>
        <div class="stat"><small>COINS</small><strong id="coins">0</strong></div>
        <div class="stat"><small>DISTANCE</small><strong><span id="distance">0</span><small> m</small></strong></div>
      </div>
      <div id="hint">W / ↑ accelerate · S / ↓ brake · A D / ← → steer</div>
    </div>
    <div id="touchControls" aria-label="Mobile cycling controls">
      <div class="steering">
        <button data-control="left" aria-label="Steer left">◀</button>
        <button data-control="right" aria-label="Steer right">▶</button>
      </div>
      <div class="pedals">
        <button data-control="brake" class="brake" aria-label="Brake">BRAKE</button>
        <button data-control="accelerate" class="accelerate" aria-label="Accelerate">PEDAL ▲</button>
      </div>
    </div>
    <div id="toast" role="status"></div>
    <div id="error" class="error" hidden></div>
  </main>
  <script type="module" src="script.js"></script>
</body>
</html>
