<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0820">
<title>Space Shooter</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #05030f;
    overflow: hidden;
    overscroll-behavior: none;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas {
    display: block;
    touch-action: none;
    background: #0b0820;
  }
</style>
</head>
<body>
<canvas id="game" aria-label="Space Shooter game. Drag to fly. Your ship fires automatically."></canvas>
<script src="game.js"></script>
</body>
</html>
